<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bookmarks - Netscape</title>
<link rel="stylesheet" href="../css/win95.css">
<link rel="stylesheet" href="dialogs.css">
</head>
<body class="w95">
<div class="w95-window">
  <div class="w95-titlebar">
    <img class="w95-titlebar-icon" src="../../assets/icons/bookmark.svg" alt="">
    <span class="w95-titlebar-text">Bookmarks - Netscape</span>
    <span class="w95-titlebar-btns"><button class="w95-tbtn close" title="Close"></button></span>
  </div>
  <div id="menubar"></div>
  <div class="w95-dialog-body">
    <div class="w95-tree w95-scroll w95-panel-sunken" id="tree"></div>
    <div id="editbar" style="display:none">
      <div class="dlg-row">
        <label for="ed-name">Name:</label>
        <input class="w95-field dlg-fill" id="ed-name" type="text">
      </div>
      <div class="dlg-row" id="ed-url-row">
        <label for="ed-url">Location:</label>
        <input class="w95-field dlg-fill" id="ed-url" type="text">
      </div>
      <div class="dlg-btnrow">
        <button class="w95-btn" id="ed-ok">OK</button>
        <button class="w95-btn" id="ed-cancel">Cancel</button>
      </div>
    </div>
    <div class="dlg-status w95-panel-thin-sunken" id="status"></div>
    <div class="dlg-btnrow">
      <button class="w95-btn" id="close">Close</button>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
