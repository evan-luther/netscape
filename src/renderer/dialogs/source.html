<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Netscape Editor</title>
<link rel="stylesheet" href="../css/win95.css">
<link rel="stylesheet" href="dialogs.css">
</head>
<body class="w95">
<div class="w95-window">
  <div class="w95-titlebar">
    <img class="w95-titlebar-icon" src="../../assets/icons/edit.svg" alt="">
    <span class="w95-titlebar-text" id="title">Netscape Editor</span>
    <span class="w95-titlebar-btns"><button class="w95-tbtn close" title="Close"></button></span>
  </div>
  <div id="menubar"></div>
  <div class="w95-dialog-body" style="padding:0">
    <textarea class="w95-field w95-scroll dlg-source-area" id="src" readonly wrap="off"></textarea>
  </div>
</div>
<script src="common.js"></script>
<script src="source.js"></script>
</body>
</html>
