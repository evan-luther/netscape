<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>History - Netscape</title>
<link rel="stylesheet" href="../css/win95.css">
<link rel="stylesheet" href="dialogs.css">
</head>
<body class="w95">
<div class="w95-window">
  <div class="w95-titlebar">
    <img class="w95-titlebar-icon" src="../../assets/icons/netscape-window.svg" alt="">
    <span class="w95-titlebar-text">History - Netscape</span>
    <span class="w95-titlebar-btns"><button class="w95-tbtn close" title="Close"></button></span>
  </div>
  <div class="w95-dialog-body">
    <div class="w95-listbox w95-scroll" id="list">
      <div class="lst-head w95-panel-raised" id="head">
        <span data-key="title">Title</span>
        <span data-key="url">Location</span>
        <span data-key="visited">Last Visited</span>
      </div>
      <div id="rows"></div>
    </div>
    <div class="dlg-btnrow">
      <button class="w95-btn" id="goto" disabled>Go to</button>
      <button class="w95-btn" id="mkbookmark" disabled>Create Bookmark</button>
      <button class="w95-btn" id="clear">Clear History</button>
      <button class="w95-btn is-default" id="close">Close</button>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="history.js"></script>
</body>
</html>
