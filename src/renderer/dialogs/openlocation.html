<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Open Location - Netscape</title>
<link rel="stylesheet" href="../css/win95.css">
<link rel="stylesheet" href="dialogs.css">
</head>
<body class="w95">
<div class="w95-window">
  <div class="w95-titlebar">
    <img class="w95-titlebar-icon" src="../../assets/icons/open.svg" alt="">
    <span class="w95-titlebar-text">Open Location - Netscape</span>
    <span class="w95-titlebar-btns"><button class="w95-tbtn close" title="Close"></button></span>
  </div>
  <div class="w95-dialog-body">
    <div class="dlg-row">
      <label for="loc">Open Location or File:</label>
    </div>
    <div class="dlg-row">
      <input class="w95-field dlg-fill" id="loc" type="text">
    </div>
    <div class="dlg-spacer"></div>
    <div class="dlg-btnrow">
      <button class="w95-btn is-default" id="open">Open</button>
      <button class="w95-btn" id="clear">Clear</button>
      <button class="w95-btn" id="browse">Browse...</button>
      <button class="w95-btn" id="cancel">Cancel</button>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="openlocation.js"></script>
</body>
</html>
